name: Android labs

on:
  push:
    branches: [lab2-navigation, lab3-lists]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37"
      - name: Build, unit tests and lint
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Navigation and list tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash gradlew :app:connectedDebugAndroidTest
      - name: Save APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lab-results
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: ignore

